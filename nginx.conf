    # ── pabqtas.marcossantiago.com (mockup Pa' Barranquitas, Municipio de Barranquitas) ──
    # Sirve design/mockup.html del proyecto. Es un prototipo para enseñarle al
    # cliente, no el sitio real: por eso va con noindex.
    server {
        listen 80;
        server_name pabqtas.marcossantiago.com;

        location /.well-known/acme-challenge/ {
            root /var/www/stream;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name pabqtas.marcossantiago.com;

        ssl_certificate     /etc/letsencrypt/live/pabqtas.marcossantiago.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pabqtas.marcossantiago.com/privkey.pem;

        root  /var/www/stream/pabarranquitas/app;
        index index.html;

        # Registro público de comercios: el comerciante llena su ficha y entra
        # a la bandeja de pendientes del panel. Vive en el repo de la plataforma
        # (pueblospr) y no en el de la app del pueblo, porque sirve a cualquier
        # municipio con ?pueblo=<slug>.
        location /registro/ {
            alias /var/www/stream/pueblospr/registro/;
            index index.html;
            try_files $uri $uri/ /registro/index.html;
            add_header Cache-Control "no-cache";
        }

        # Panel de administración (PocketBase detrás) — prototipo multi-municipio.
        location /panel/ {
            alias /var/www/stream/pueblospr/panel/;
            index index.html;
            try_files $uri $uri/ /panel/index.html;
            add_header Cache-Control "no-cache";
        }

        # PocketBase: API, archivos y su propio panel en /pb/_/
        location /pb/ {
            proxy_pass http://127.0.0.1:8092/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20m;
            proxy_read_timeout 120s;
        }

        # El mockup original queda accesible para poder comparar diseño vs. app.
        location = /mockup {
            alias /var/www/stream/pabarranquitas/design/mockup.html;
            default_type text/html;
        }

        # Un mockup no debe salir en Google antes que el sitio del municipio.
        add_header X-Robots-Tag "noindex, nofollow" always;

        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # Sin caché: mientras se itera el diseño, el cliente tiene que ver la
        # última versión sin tener que vaciar el navegador.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }

    include /etc/nginx/kioskko-tiendas/*.conf;

