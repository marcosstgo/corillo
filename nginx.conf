    server {
        listen 80;
        server_name conteo.marcossantiago.com;

        location /.well-known/acme-challenge/ {
            root /var/www/stream;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name conteo.marcossantiago.com;

        ssl_certificate     /etc/letsencrypt/live/conteo.marcossantiago.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/conteo.marcossantiago.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        root /var/www/conteo;
        index index.html;

        # Sirve los .gz que genera build.sh (nivel 9) en vez de comprimir en
        # cada petición al nivel 1. Ojo: nginx no compara fechas — si el .gz
        # queda viejo, sirve contenido viejo. build.sh los regenera siempre.
        gzip_static on;

        # Cabeceras de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            proxy_pass http://127.0.0.1:8300;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # El API limita intentos de login por IP: sin esto vería 127.0.0.1
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20M;
        }

        location /pb-conteo/ {
            rewrite ^/pb-conteo/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8095;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Ojo: un add_header dentro de un location cancela los heredados del
        # server (incluidas las cabeceras de seguridad). Por eso aquí se usa
        # expires, que fija Cache-Control sin romper la herencia.
        location ~* \.(js|css|png|jpg|jpeg|svg|webp|woff2?)$ {
            expires 30d;
        }

        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }

