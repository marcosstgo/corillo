    # ── color.marcossantiago.com (Color IO) ──
    server {
        listen 80;
        server_name color.marcossantiago.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name color.marcossantiago.com;

        ssl_certificate     /etc/letsencrypt/live/color.marcossantiago.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/color.marcossantiago.com/privkey.pem;

        root /var/www/color-io;
        index index.html;

        # Service worker — sin cache para que actualizaciones propaguen de inmediato
        location = /service-worker.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Service-Worker-Allowed "/";
        }

        # Archivos WASM
        location ~* \.wasm$ {
            add_header Content-Type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Assets estáticos — cache larga
        location ~* \.(js|css|png|svg|ico|jpg|jpeg|gif|webp|woff2|woff|ttf|json)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
        gzip_min_length 1024;
    }

