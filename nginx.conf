user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Soporte WebSocket para proxys reversos (Blazor Server / SignalR).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Formato con tiempos para diagnosticar lentitud:
    #  rt=tiempo total de la petición · urt=tiempo del upstream/proxy · status · bytes · UA
    log_format timed '$remote_addr - [$time_local] "$request" '
                     '$status ${body_bytes_sent}b '
                     'rt=${request_time}s urt="$upstream_response_time" '
                     'ref="$http_referer" ua="$http_user_agent"';
    access_log /var/log/nginx/access.log timed buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=pb_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=pb_api:10m rate=30r/s;

    # www.corillo.live → redirige a non-www (no hay cert para www)
    server {
        listen 80;
        server_name www.corillo.live;

        location /.well-known/acme-challenge/ {
            root /var/www/stream;
        }

        location / {
            return 301 https://corillo.live$request_uri;
        }
    }

    # HTTP → HTTPS redirect (todos los dominios)
    server {
        listen 80;
        server_name corillo.live stream.marcossantiago.com marcossantiago.com www.marcossantiago.com vault.marcossantiago.com uptime.corillo.live status.corillo.live pb.corillo.live kioskko.com www.kioskko.com demo.kioskko.com yanetshop.kioskko.com pb-yanetshop.kioskko.com;

        # certbot ACME challenge — no redirigir
        location /.well-known/acme-challenge/ {
            root /var/www/stream;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # www.corillo.live HTTPS → redirige a non-www
    server {
        listen 443 ssl;
        listen 443 quic reuseport;
        http2 on;
        server_name www.corillo.live;

        ssl_certificate     /etc/letsencrypt/live/corillo.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/corillo.live/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://corillo.live$request_uri;
    }

    # ── CORILLO.LIVE + STREAM.MARCOSSANTIAGO.COM ──
    server {
        listen 443 ssl;
        listen 443 quic;
        http2 on;
        server_name corillo.live stream.marcossantiago.com;

        ssl_certificate     /etc/letsencrypt/live/corillo.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/corillo.live/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        root /var/www/stream/dist;
        client_max_body_size 500M;

        # HLS → MediaMTX — sin buffer (streaming en tiempo real)
        location ^~ /live/ {
            # Master playlist sintético para ABR: 720p (_low, la genera corillo-stream-up.sh)
            # primero para arranque rápido, 1080p después; hls.js / Safari suben solos.
            # Sin CODECS a propósito: cada streamer manda un perfil distinto y el player lo
            # detecta del propio segmento. BANDWIDTH son techos aproximados.
            location ~ ^/live/([a-z0-9_]+)/master\.m3u8$ {
                # RESOLUTION real leida de mediamtx en vivo (corillo-api:/live-manifest/) --
                # antes era un 'return' con 1080x720 fijos, ver incidente 2026-09-09.
                proxy_pass http://127.0.0.1:3004/live-manifest/$1;
                proxy_set_header Host $host;
                add_header Cache-Control "no-store" always;
                add_header Access-Control-Allow-Origin * always;
            }
            proxy_pass http://127.0.0.1:8888;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 30s;
        }

        # MediaMTX API
        location ^~ /mediamtx-api/ {
            rewrite ^/mediamtx-api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:9997;
            proxy_set_header Host $host;
        }

        # Twitch API proxy
        location ^~ /twitch-api/ {
            rewrite ^/twitch-api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8880;
            proxy_set_header Host $host;
        }

        # Telegram service — webhook, join, admin
        location ^~ /api/telegram-webhook { rewrite ^/api/(.*) /$1 break; proxy_pass http://127.0.0.1:3003; proxy_http_version 1.1; proxy_set_header Host $host; }
        location ^~ /api/join             { rewrite ^/api/(.*) /$1 break; proxy_pass http://127.0.0.1:3003; proxy_http_version 1.1; proxy_set_header Host $host; }
        location ^~ /api/register         { rewrite ^/api/(.*) /$1 break; proxy_pass http://127.0.0.1:3003; proxy_http_version 1.1; proxy_set_header Host $host; }
        location ^~ /api/admin            { rewrite ^/api/(.*) /$1 break; proxy_pass http://127.0.0.1:3003; proxy_http_version 1.1; proxy_set_header Host $host; }

        # VOD upload — archivos grandes, sin buffering nginx, timeout largo
        location ^~ /api/upload-vod {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:3004;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            client_max_body_size 3G;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # BF6 stats proxy — puerto 3011
        location ^~ /api/bf6/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:3011;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 15s;
        }

        # Corillo API — catch-all, no regex necesario para endpoints nuevos
        location ^~ /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:3004;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # IP real del visitante (límites por IP del Mercado). nginx la sobrescribe: no se puede falsificar.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_request_buffering off;
            proxy_read_timeout 310s;
        }

        # Telegram service — excepción dentro de /chat-api/ (webhook registrado ahí)
        location ~ ^/chat-api/(telegram-webhook|join|admin) {
            rewrite ^/chat-api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:3003;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Chat bot — WebSocket, IA, digest
        location /chat-api/ {
            rewrite ^/chat-api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # WebRTC WHEP
        location ^~ /webrtc/ {
            proxy_pass http://127.0.0.1:8889/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Reels — archivos 9:16 generados por el streamer
        location ^~ /vods/reels/ {
            alias /var/vods/reels/;
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # VOD index page y VOD player — antes que el alias /vods/
        location = /vods/ {
            root /var/www/stream/dist;
            try_files /vods/index.html =404;
        }
        location /vods/v/ {
            root /var/www/stream/dist;
            try_files $uri $uri/index.html =404;
        }

        # VODs — archivos de grabación servidos directamente
        location ^~ /vods/ {
            alias /var/vods/live/;
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Thumbnails — generadas por corillo-thumbs, fuera de dist/
        location ^~ /assets/thumbs/ {
            alias /var/www/stream/assets/thumbs/;
            expires 30s;
            add_header Cache-Control "public, max-age=30";
        }

        # Kick banners — generados por bitrate-monitor, fuera de dist/
        location ^~ /assets/kick/ {
            alias /var/www/stream/assets/kick/;
            expires 5s;
            add_header Cache-Control "public, max-age=5";
        }

        # Service Worker — sin cache para que el browser detecte updates
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Assets hasheados por Astro (/_astro/) — nombre con hash de contenido → inmutables
        location ^~ /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Fuentes (FontAwesome, etc.) — nombre fijo y estable → cache largo
        location ~* \.(woff2?|ttf|eot)$ {
            add_header Cache-Control "public, max-age=15552000";
        }

        # JS/CSS — cache 1 hora
        location ~* \.(js|css)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600, stale-while-revalidate=300";
        }

        # Imágenes/iconos estáticos — cache 7 días
        location ~* \.(png|svg|ico|webp)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        }

        # manifest.json y version.json — cache 60s
        location ~ ^/(manifest\.json|version\.json)$ {
            expires 60s;
            add_header Cache-Control "public, max-age=60";
        }

        # BF6 overlay generator — archivos estáticos de /opt/corillo/bf6-proxy/public/
        location ^~ /overlay/bf6/ {
            alias /opt/corillo/bf6-proxy/public/;
            add_header Access-Control-Allow-Origin *;
            expires 60s;
        }

        # Portada de overlays (/overlay/) y página de WARDOGS (/overlay/wardogs/), separadas de BF6.
        # Las rutas sin barra final se redirigen: si no, "overlay"/"wardogs" caerían en el regex de canales.
        location = /overlay        { return 301 /overlay/; }
        location = /overlay/bf6    { return 301 /overlay/bf6/; }
        location = /overlay/wardogs { return 301 /overlay/wardogs/; }
        location ^~ /overlay/wardogs/ {
            alias /opt/corillo/bf6-proxy/public/wardogs/;
            add_header Access-Control-Allow-Origin *;
            expires 60s;
        }
        location ^~ /overlay/ {
            alias /opt/corillo/bf6-proxy/hub/;
            add_header Access-Control-Allow-Origin *;
            expires 60s;
        }

        # Mercado: un anuncio recién publicado aún no tiene página estática (se recompila en ~1 min).
        # Mientras tanto se sirve una página que lo muestra desde la API. Sin esto, la regex de canales
        # de abajo mandaría /mercado/a/<id>/ al player.
        location ^~ /mercado/a/ {
            try_files $uri $uri/index.html /mercado/anuncio/index.html;
        }
        location ^~ /en/mercado/a/ {
            try_files $uri $uri/index.html /en/mercado/anuncio/index.html;
        }

        # Rechaza rutas tipo archivo usadas como canal ficticio
        location ~ ^/[^/]*\.[^/]+(?:/|$) {
            try_files $uri =404;
        }
        # Canales — captura el key e inyecta en el template via sub_filter
        location ~ ^/([a-z0-9][a-z0-9_]*)(/|$) {
            set $ch $1;
            try_files $uri $uri/index.html @channel;
        }

        location @channel {
            gzip off;
            sub_filter '__CHANNEL__' $ch;
            sub_filter_once off;
            root /var/www/stream/dist;
            rewrite ^ /player/index.html break;
        }

        # Frontend estático — resto de paths
        location / {
            try_files $uri $uri/index.html =404;
        }
    }


    # ── MARCOSSANTIAGO.COM ──
    server {
        listen 443 ssl;
        listen 443 quic;
        http2 on;
        server_name marcossantiago.com www.marcossantiago.com;

        ssl_certificate     /etc/letsencrypt/live/marcossantiago.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/marcossantiago.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        # Vigil — landing page pública
        location /vigil {
            rewrite ^/vigil(/.*)?$ /vigil$1 break;
            proxy_pass http://127.0.0.1:8200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Windows Event Monitor — dashboard privado
        location /win-monitor/ {
            rewrite ^/win-monitor/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ms-chat/ {
            rewrite ^/ms-chat/(.*) /$1 break;
            proxy_pass http://127.0.0.1:3005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ms-blog/ {
            rewrite ^/ms-blog/(.*) /$1 break;
            proxy_pass http://127.0.0.1:3006;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Generador de logos con IA — sidecar :3012
        location /logo-api/ {
            rewrite ^/logo-api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:3012;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location / {
            proxy_pass http://127.0.0.1:3010;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── PB.CORILLO.LIVE — Pocketbase ──
    server {
        listen 443 ssl;
        listen 443 quic;
        http2 on;
        server_name pb.corillo.live;

        ssl_certificate     /etc/letsencrypt/live/pb.corillo.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pb.corillo.live/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        client_max_body_size 10M;

        # Bloquear rutas de scanners y bots — cierra la conexión sin respuesta
        location ~* \.(env|git|svn|htaccess|htpasswd|DS_Store)$ { return 444; }
        location ~* /(wp-config|wp-login|wp-includes|wp-admin|xmlrpc|phpinfo|phpmyadmin|adminer|setup|install|backup|shell|eval) { return 444; }
        location ~* \.(php|asp|aspx|jsp|cgi|pl|py|sh|bash)$ { return 444; }

        # API — rate limit
        location /api/ {
            limit_req zone=pb_api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location / {
            limit_req zone=pb_general burst=30 nodelay;
            limit_req_status 429;

            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

